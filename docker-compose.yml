services:
  pingora-lb:
    profiles: [ "lb", "all", "default" ]
    build:
      context: .
      dockerfile: Dockerfile.pingora
    container_name: pingora-lb
    hostname: pingora-lb.edge.local
    ports:
      - "80:80"
      - "8081:8081"
    networks:
      edge-net:
        ipv4_address: 172.30.0.2
    environment:
      - PROXY_ADDR=0.0.0.0:80
      - API_ADDR=0.0.0.0:8081
      - HEALTH_CHECK_INTERVAL_SECS=5
    healthcheck:
      test: [ "CMD-SHELL", "python3 -c \"import urllib.request; resp=urllib.request.urlopen('http://localhost:8081/health'); exit(0 if resp.status==200 else 1)\"" ]
      interval: 2s
      timeout: 2s
      retries: 5
      start_period: 1s

  pingora-discover:
    profiles: [ "lb", "discover", "all", "default" ]
    build:
      context: .
      dockerfile: Dockerfile.discover
    container_name: pingora-discover
    restart: "no"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - edge-net
    depends_on:
      pingora-lb:
        condition: service_healthy

  sample-app-1:
    profiles: [ "app", "all" ]
    build:
      context: ./sample_app
    container_name: sample-app-1
    hostname: sample-app-1.edge.local
    environment:
      - INSTANCE_ID=app-1
    networks:
      edge-net:
        ipv4_address: 172.30.0.10

  sample-app-2:
    profiles: [ "app", "all" ]
    build:
      context: ./sample_app
    container_name: sample-app-2
    hostname: sample-app-2.edge.local
    environment:
      - INSTANCE_ID=app-2
    networks:
      edge-net:
        ipv4_address: 172.30.0.11

  event-watcher:
    profiles: [ "watcher", "all" ]
    build:
      context: .
      dockerfile: Dockerfile.discover
    container_name: event-watcher
    restart: "no"
    entrypoint: [ "/app/discover_cli", "watch", "--api-url", "http://pingora-lb:8081", "--network", "edge-net" ]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - edge-net
    depends_on:
      pingora-lb:
        condition: service_healthy

networks:
  edge-net:
    name: edge-net
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/16
