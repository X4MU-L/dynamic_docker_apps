[package]
name = "dynamic_docker_apps"
version = "0.1.0"
edition = "2021"

[dependencies]
pingora = { version = "0.8.1", features = [
    "proxy",
    "lb",
    "cache",
    "openssl",
] }
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1.38", features = ["full"] }
axum = { version = "0.8", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
arc-swap = "1.7"
reqwest = { version = "0.13", features = ["json"] }
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = "0.3"

[dev-dependencies]
tokio-test = "0.4"
